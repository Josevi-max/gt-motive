<div class="bg-white rounded-lg shadow-xl">
    <div class="flex items-center justify-between p-4 border-b border-gray-200">
        <div class="flex items-center gap-2">
            <mat-icon class="text-red-500">{{ errorIcon }}</mat-icon>
            <h2 mat-dialog-title class="text-lg font-semibold text-gray-900 m-0">{{ errorTitle }}</h2>
        </div>
        <button mat-icon-button (click)="close()" class="text-gray-400 hover:text-gray-600 cursor-pointer">
            <mat-icon>close</mat-icon>
        </button>
    </div>

    <mat-dialog-content class="p-6">
        <p class="text-gray-600 m-0">{{ errorMessage }}</p>
    </mat-dialog-content>
</div>
