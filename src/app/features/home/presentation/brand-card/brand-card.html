<mat-card class="brand-card w-full hover:shadow-lg transition-shadow duration-200 
                 cursor-pointer group border border-gray-100 dark:border-gray-700
                 hover:border-blue-200 dark:hover:border-blue-800 cursor">
  
  <mat-card-content class="p-3 sm:p-4">
    <div class="flex flex-col sm:flex-row items-center gap-2 sm:gap-4">
      
      <div class="brand-icon p-2 sm:p-3 rounded-lg 
                  bg-gradient-to-br from-blue-50 to-indigo-50 
                  dark:from-gray-700 dark:to-gray-600
                  group-hover:from-blue-100 group-hover:to-indigo-100
                  transition-all duration-200">
        <mat-icon class="text-blue-600 dark:text-blue-400 text-xl sm:text-2xl">
          directions_car
        </mat-icon>
      </div>

      <div class="flex-1 min-w-0">
        <span class="text-sm sm:text-base lg:text-lg font-medium 
                     text-gray-800 dark:text-gray-200
                     group-hover:text-blue-600 dark:group-hover:text-blue-400
                     transition-colors duration-200 block truncate">
          {{ brandName }}
        </span>
      </div>

      <div class="opacity-0 group-hover:opacity-100 transition-opacity duration-200
                  text-gray-400 group-hover:text-blue-500 hidden sm:block">
        <mat-icon class="text-xl">chevron_right</mat-icon>
      </div>

    </div>
  </mat-card-content>
</mat-card>
